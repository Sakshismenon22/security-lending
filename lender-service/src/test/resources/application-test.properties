spring.datasource.url=jdbc:h2:mem:lender;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=ROLE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
lender.kafka-enabled=false
lender.jobs-enabled=false
spring.main.banner-mode=off
logging.level.root=WARN
