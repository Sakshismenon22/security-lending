spring.application.name=lender-service
server.port=8084
spring.datasource.url=jdbc:postgresql://localhost:5432/lender_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.task.scheduling.pool.size=2
lender.kafka-enabled=true
lender.jobs-enabled=true
lender.commands-topic=lender.commands.v1
lender.lifecycle-events-topic=lender.lifecycle.events.v1
lender.market-data-url=http://localhost:8080
lender.frontend-origin=http://localhost:5174
lender.max-price-age-seconds=900
management.endpoints.web.exposure.include=health,info
