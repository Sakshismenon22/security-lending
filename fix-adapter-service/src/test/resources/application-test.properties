spring.datasource.url=jdbc:h2:mem:fix_adapter;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
adapter.side=BORROWER
adapter.institution-id=BORROWER_DEMO
adapter.sender-comp-id=BORROWER_DEMO
adapter.outbound-topic=borrower.commands.v1
adapter.inbound-topic=borrower.confirmations.v1
adapter.consumer-group=adapter-tests
adapter.routes[0].counterparty-id=LENDER_DEMO
adapter.routes[0].target-comp-id=LENDER_DEMO
adapter.routes[0].organization-ids=1
adapter.fix-enabled=false
adapter.kafka-enabled=false
adapter.workers-enabled=false
logging.level.root=WARN
spring.main.banner-mode=off
