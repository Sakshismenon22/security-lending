spring.datasource.url=jdbc:h2:mem:borrower;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,ROLE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
borrower.jobs-enabled=false
borrower.kafka-enabled=false
borrower.fix-enabled=false
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger=OFF
