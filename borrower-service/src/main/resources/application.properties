spring.application.name=borrower-service
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/borrower_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=borrower-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
borrower.market-data-url=http://localhost:8080
borrower.frontend-origin=http://localhost:5173
borrower.max-price-age-seconds=900
borrower.jobs-enabled=true
borrower.kafka-enabled=true
borrower.events-topic=borrower.events.v1
borrower.market-events-topic=market.prices.v1
management.endpoints.web.exposure.include=health,info
borrower.confirmations-topic=borrower.confirmations.v1
borrower.commands-topic=borrower.commands.v1
