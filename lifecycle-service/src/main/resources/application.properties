spring.application.name=lifecycle-service
server.port=8085
spring.datasource.url=jdbc:postgresql://localhost:5432/lender_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
lifecycle.kafka-enabled=true
lifecycle.lender-commands-topic=lender.lifecycle.commands.v1
lifecycle.recall-deadline-poll-ms=5000
lifecycle.margin-check-cron=0 15 15 * * *
lifecycle.lender-events-topic=lender.lifecycle.events.v1
lifecycle.rebate-demo-enabled=true
lifecycle.fee-demo-enabled=true
lifecycle.market-data-url=http://localhost:8080
