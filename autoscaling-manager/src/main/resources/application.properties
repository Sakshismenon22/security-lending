spring.application.name=autoscaling-manager
server.port=8090

# Borrower Service Actuator endpoint monitored by this manager.
autoscaling.targets.borrower.base-url=http://127.0.0.1:8081
autoscaling.targets.borrower.cpu-metric-path=/actuator/metrics/process.cpu.usage

# CPU-only scale-out evaluation policy.
autoscaling.cpu.threshold=0.80
autoscaling.cpu.evaluation-interval-ms=15000
autoscaling.cpu.consecutive-breaches=3

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
