spring.application.name=autoscaling-manager
server.port=8090

# Borrower Service Actuator endpoint monitored by this manager.
autoscaling.targets.borrower.base-url=http://127.0.0.1:8081
autoscaling.targets.borrower.cpu-metric-path=/actuator/metrics/process.cpu.usage

# CPU-only autoscaling policy with hysteresis to avoid rapid scale-in/scale-out oscillation. 0.80
autoscaling.cpu.threshold=0.80
autoscaling.cpu.scale-in-threshold=0.30
autoscaling.cpu.evaluation-interval-ms=15000
autoscaling.cpu.consecutive-breaches=3
autoscaling.cpu.consecutive-low-readings=5

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Local Borrower JVM process management.
# Build borrower-service with Maven package before enabling scale-out.
autoscaling.borrower.working-directory=../borrower-service
autoscaling.borrower.jar=target/borrower-service-0.0.1-SNAPSHOT.jar
autoscaling.borrower.log-directory=../runtime/autoscaling
autoscaling.borrower.first-port=8181
autoscaling.borrower.last-port=8190
autoscaling.borrower.baseline-instances=2
autoscaling.borrower.max-instances=5
autoscaling.borrower.startup-timeout-seconds=180
autoscaling.cpu.cooldown-ms=60000


# Eureka discovery registry used by Spring Cloud LoadBalancer.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5

# Keep the discovery cache responsive for local scale-out and process shutdown.
spring.cloud.loadbalancer.cache.ttl=5s
spring.cloud.loadbalancer.retry.enabled=false
autoscaling.targets.borrower.service-id=borrower-service
