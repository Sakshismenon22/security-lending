spring.application.name=market-data-service
server.port=8080
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/market_data
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.example.splitease=DEBUG
market-data.poll-interval-ms=60000

# Local demo: share the PostgreSQL connection budget across all service processes.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.pool-name=${spring.application.name}-${server.port:8080}
spring.datasource.hikari.data-source-properties.ApplicationName=${spring.application.name}:${server.port:8080}

# Local autoscaling telemetry; management endpoints are bound to loopback only.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.server.address=127.0.0.1
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.50,0.95,0.99
