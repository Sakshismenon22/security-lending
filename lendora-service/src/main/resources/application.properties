spring.application.name=lendora-service
server.port=${LENDORA_PORT:8086}
spring.datasource.url=${LENDORA_DATABASE_URL:jdbc:postgresql://localhost:5432/lendora_db}
spring.datasource.username=${LENDORA_DATABASE_USERNAME:postgres}
spring.datasource.password=${LENDORA_DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
lendora.allowed-origins=${LENDORA_ALLOWED_ORIGINS:http://localhost:5176,http://localhost:5175,http://localhost:5174,http://localhost:5173}
lendora.provisioning-key=${LENDORA_PROVISIONING_KEY:}
lendora.lender-url=${LENDORA_LENDER_SERVICE_URL:http://localhost:8084}
lendora.borrower-url=${LENDORA_BORROWER_SERVICE_URL:http://localhost:8081}
lendora.secure-cookie=${LENDORA_SECURE_COOKIE:false}
lendora.session-hours=12
lendora.remember-days=30

# Local demo: share the PostgreSQL connection budget across all service processes.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.pool-name=${spring.application.name}-${server.port:8080}
spring.datasource.hikari.data-source-properties.ApplicationName=${spring.application.name}:${server.port:8080}

lendora.lender-institution-id=${LENDORA_LENDER_INSTITUTION_ID:LENDER_DEMO}
lendora.borrower-institution-id=${LENDORA_BORROWER_INSTITUTION_ID:BORROWER_DEMO}

# Local autoscaling telemetry; management endpoints are bound to loopback only.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.server.port=9086
management.server.address=127.0.0.1
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.50,0.95,0.99
